name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Keystore & Environment
        run: |
          # 1. Decode debug keystore if base64 is provided, stripping any whitespace/newlines
          if [ -f "debug.keystore.base64" ]; then
            tr -d '\r\n ' < debug.keystore.base64 | base64 -d > debug.keystore 2>/dev/null || true
          fi

          # 2. If debug.keystore is missing or empty, generate a valid debug keystore
          if [ ! -s "debug.keystore" ]; then
            echo "Generating debug.keystore with keytool..."
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          # 3. Create .env if missing to satisfy Secrets Gradle plugin
          if [ ! -f ".env" ]; then
            if [ -f ".env.example" ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

          # 4. Make gradlew executable
          chmod +x gradlew

          # 5. Automatically accept Android SDK licenses using pre-installed Android SDK
          if [ -n "$ANDROID_HOME" ] && [ -d "$ANDROID_HOME" ]; then
            mkdir -p "$ANDROID_HOME/licenses" || true
            echo -e "24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n2fa8c25502371fb36b476077a204003e3ddf45c4" > "$ANDROID_HOME/licenses/android-sdk-license" || true
            echo -e "84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b816f454d0e" > "$ANDROID_HOME/licenses/android-sdk-preview-license" || true
            yes | sdkmanager --licenses 2>/dev/null || yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --no-configuration-cache --stacktrace

      - name: Verify and Align APK
        run: |
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -f "$APK" ]; then
            echo "Verifying APK: $APK"
            # Find build-tools directory containing apksigner and zipalign
            BUILD_TOOLS=$(find $ANDROID_HOME/build-tools -name "apksigner" 2>/dev/null | head -n 1)
            if [ -n "$BUILD_TOOLS" ]; then
              BUILD_TOOLS_DIR=$(dirname "$BUILD_TOOLS")
              echo "Using build-tools from: $BUILD_TOOLS_DIR"
              "$BUILD_TOOLS_DIR/zipalign" -c -v 4 "$APK" || {
                echo "Re-aligning APK..."
                "$BUILD_TOOLS_DIR/zipalign" -f -v 4 "$APK" "${APK}.aligned"
                mv "${APK}.aligned" "$APK"
              }
              "$BUILD_TOOLS_DIR/apksigner" verify --verbose "$APK" || true
            fi
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MushafStock-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 30
