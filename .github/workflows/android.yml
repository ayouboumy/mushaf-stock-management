name: Build & Release Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Sign Universal APK (Pixel & Universal Compatibility)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Keystore & Environment
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEYSTORE_PASSWORD_SECRET: ${{ secrets.KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_ALIAS_SECRET: ${{ secrets.KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_PASSWORD_SECRET: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p app || true

          # 1. Prepare Persistent Release Keystore
          B64_DATA="${ANDROID_KEYSTORE_BASE64:-$RELEASE_KEYSTORE_BASE64}"
          STORE_PASS="${ANDROID_KEYSTORE_PASSWORD:-${KEYSTORE_PASSWORD_SECRET:-android}}"
          KEY_ALIAS_VAL="${ANDROID_KEY_ALIAS:-${KEY_ALIAS_SECRET:-upload}}"
          KEY_PASS_VAL="${ANDROID_KEY_PASSWORD:-${KEY_PASSWORD_SECRET:-$STORE_PASS}}"

          if [ -n "$B64_DATA" ]; then
            echo "Using custom release keystore from GitHub Secrets..."
            echo "$B64_DATA" | tr -d '\r\n ' | base64 -d > release.keystore
          elif [ -f "release.keystore.base64" ]; then
            echo "Using repository persistent release.keystore.base64..."
            tr -d '\r\n ' < release.keystore.base64 | base64 -d > release.keystore
          elif [ -f "release.keystore" ]; then
            echo "Using existing release.keystore file..."
          else
            echo "Generating persistent release.keystore..."
            keytool -genkeypair -v -keystore release.keystore \
              -storepass android -alias upload -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=MushafStock,OU=App,O=MushafStock,C=MA" </dev/null
            STORE_PASS="android"
            KEY_ALIAS_VAL="upload"
            KEY_PASS_VAL="android"
          fi

          # 2. Prepare Guaranteed Debug Keystore (Alias: androiddebugkey)
          if [ -f "debug.keystore.base64" ]; then
            tr -d '\r\n ' < debug.keystore.base64 | base64 -d > debug.keystore
          fi

          if [ ! -f "debug.keystore" ] || ! keytool -list -keystore debug.keystore -storepass android -alias androiddebugkey >/dev/null 2>&1; then
            echo "Generating valid debug.keystore with androiddebugkey..."
            rm -f debug.keystore
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US" </dev/null
          fi

          # Copy both keystores to root and app/ directory for Gradle resolution
          cp -f release.keystore app/release.keystore || true
          cp -f debug.keystore app/debug.keystore || true

          echo "RELEASE_KEYSTORE_PATH=$(pwd)/release.keystore" >> $GITHUB_ENV
          echo "RELEASE_STORE_PASS=$STORE_PASS" >> $GITHUB_ENV
          echo "RELEASE_KEY_ALIAS=$KEY_ALIAS_VAL" >> $GITHUB_ENV
          echo "RELEASE_KEY_PASS=$KEY_PASS_VAL" >> $GITHUB_ENV
          echo "DEBUG_KEYSTORE_PATH=$(pwd)/debug.keystore" >> $GITHUB_ENV

          # 3. Setup .env file
          if [ ! -f ".env" ]; then
            if [ -f ".env.example" ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

          # 4. Make gradlew executable
          chmod +x gradlew

          # 5. Automatically accept Android SDK licenses
          if [ -n "$ANDROID_HOME" ] && [ -d "$ANDROID_HOME" ]; then
            mkdir -p "$ANDROID_HOME/licenses" || true
            echo -e "24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n2fa8c25502371fb36b476077a204003e3ddf45c4" > "$ANDROID_HOME/licenses/android-sdk-license" || true
            echo -e "84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b816f454d0e" > "$ANDROID_HOME/licenses/android-sdk-preview-license" || true
            yes | sdkmanager --licenses 2>/dev/null || yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          fi

      - name: Build Android APKs (Release & Debug)
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          RELEASE_KEYSTORE_PATH: ${{ env.RELEASE_KEYSTORE_PATH }}
          RELEASE_KEYSTORE_PASSWORD: ${{ env.RELEASE_STORE_PASS }}
          RELEASE_KEY_ALIAS: ${{ env.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ env.RELEASE_KEY_PASS }}
          DEBUG_KEYSTORE_PATH: ${{ env.DEBUG_KEYSTORE_PATH }}
        run: |
          ./gradlew assembleRelease assembleDebug --no-daemon --no-configuration-cache --stacktrace

      - name: Align and Package Universal Release APK
        id: sign_apk
        run: |
          set -e
          mkdir -p build-artifacts

          BUILD_TOOLS=$(find ${ANDROID_HOME:-/opt/android/sdk} -name "apksigner" 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$BUILD_TOOLS" ]; then
            echo "Error: apksigner not found"
            exit 1
          fi
          BUILD_TOOLS_DIR=$(dirname "$BUILD_TOOLS")
          echo "Using Android Build Tools: $BUILD_TOOLS_DIR"

          # 1. Process Release APK
          RAW_RELEASE=$(find app/build/outputs/apk/release -name "*.apk" ! -name "*-unaligned.apk" | head -n 1)
          if [ -z "$RAW_RELEASE" ] || [ ! -f "$RAW_RELEASE" ]; then
            echo "Error: Release APK not generated by Gradle"
            exit 1
          fi
          echo "Found raw release APK: $RAW_RELEASE"

          # Copy to primary standardized universal filename and aliases
          cp -f "$RAW_RELEASE" "build-artifacts/MushafStock-v1.0.1-universal-release.apk"
          cp -f "$RAW_RELEASE" "build-artifacts/MushafStock-release.apk"
          cp -f "$RAW_RELEASE" "build-artifacts/MushafStock-universal.apk"

          # Verify if already valid and signed by Gradle
          if ! "$BUILD_TOOLS_DIR/apksigner" verify "build-artifacts/MushafStock-v1.0.1-universal-release.apk" >/dev/null 2>&1; then
            echo "Re-aligning and re-signing universal release APK..."
            "$BUILD_TOOLS_DIR/zipalign" -p -f 4 "$RAW_RELEASE" "build-artifacts/MushafStock-v1.0.1-universal-release.apk"
            "$BUILD_TOOLS_DIR/apksigner" sign \
              --ks release.keystore \
              --ks-pass "pass:$RELEASE_STORE_PASS" \
              --ks-key-alias "$RELEASE_KEY_ALIAS" \
              --key-pass "pass:$RELEASE_KEY_PASS" \
              --min-sdk-version 23 \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              "build-artifacts/MushafStock-v1.0.1-universal-release.apk"
            cp -f "build-artifacts/MushafStock-v1.0.1-universal-release.apk" "build-artifacts/MushafStock-release.apk"
            cp -f "build-artifacts/MushafStock-v1.0.1-universal-release.apk" "build-artifacts/MushafStock-universal.apk"
          fi

          # Calculate SHA-256 checksum
          sha256sum "build-artifacts/MushafStock-v1.0.1-universal-release.apk" | tee "build-artifacts/MushafStock-v1.0.1-universal-release.apk.sha256"

          # 2. Process Debug APK
          RAW_DEBUG=$(find app/build/outputs/apk/debug -name "*.apk" ! -name "*-unaligned.apk" | head -n 1)
          if [ -n "$RAW_DEBUG" ] && [ -f "$RAW_DEBUG" ]; then
            echo "Found raw debug APK: $RAW_DEBUG"
            cp -f "$RAW_DEBUG" "build-artifacts/MushafStock-debug.apk"

            if ! "$BUILD_TOOLS_DIR/apksigner" verify "build-artifacts/MushafStock-debug.apk" >/dev/null 2>&1; then
              echo "Re-aligning and re-signing debug APK..."
              "$BUILD_TOOLS_DIR/zipalign" -p -f 4 "$RAW_DEBUG" "build-artifacts/MushafStock-debug.apk"
              "$BUILD_TOOLS_DIR/apksigner" sign \
                --ks debug.keystore \
                --ks-pass "pass:android" \
                --ks-key-alias "androiddebugkey" \
                --key-pass "pass:android" \
                --min-sdk-version 23 \
                --v1-signing-enabled true \
                --v2-signing-enabled true \
                --v3-signing-enabled true \
                "build-artifacts/MushafStock-debug.apk"
            fi
          fi

      - name: Strict APK Verification & Comprehensive Diagnostics
        run: |
          set -e
          BUILD_TOOLS=$(find ${ANDROID_HOME:-/opt/android/sdk} -name "aapt2" 2>/dev/null | sort -V | tail -n 1)
          BUILD_TOOLS_DIR=$(dirname "$BUILD_TOOLS")

          TARGET_APK="build-artifacts/MushafStock-v1.0.1-universal-release.apk"
          if [ ! -f "$TARGET_APK" ]; then
            echo "FATAL: $TARGET_APK not found!"
            exit 1
          fi

          echo "=========================================================="
          echo "         STRICT VERIFICATION: $TARGET_APK                 "
          echo "=========================================================="
          echo "File Size: $(du -h "$TARGET_APK" | cut -f1)"
          echo "SHA-256:   $(cat build-artifacts/MushafStock-v1.0.1-universal-release.apk.sha256)"

          echo -e "\n--- Package Badging & Identity ---"
          if [ -f "$BUILD_TOOLS_DIR/aapt" ]; then
            "$BUILD_TOOLS_DIR/aapt" dump badging "$TARGET_APK" | grep -E "package:|sdkVersion:|targetSdkVersion:|uses-feature:|native-code:" || true
          else
            "$BUILD_TOOLS_DIR/aapt2" dump badging "$TARGET_APK" | grep -E "package:|sdkVersion:|targetSdkVersion:|uses-feature:|native-code:" || true
          fi

          echo -e "\n--- Zipalign Alignment Check (4-byte alignment) ---"
          "$BUILD_TOOLS_DIR/zipalign" -c -v 4 "$TARGET_APK" | tail -n 3

          echo -e "\n--- Signature Verification & Schemes (V1, V2, V3) ---"
          # This command must succeed with exit code 0 or workflow will fail
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose "$TARGET_APK"

          echo -e "\n--- Certificate Details & SHA Fingerprints ---"
          "$BUILD_TOOLS_DIR/apksigner" verify --print-certs "$TARGET_APK" | grep -E "Signer|digest" || true
          echo "=========================================================="

      - name: Upload Universal Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MushafStock-v1.0.1-universal-release
          path: |
            build-artifacts/MushafStock-v1.0.1-universal-release.apk
            build-artifacts/MushafStock-v1.0.1-universal-release.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Create Release & Upload Asset (On Tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build-artifacts/MushafStock-v1.0.1-universal-release.apk
            build-artifacts/MushafStock-v1.0.1-universal-release.apk.sha256
            build-artifacts/MushafStock-debug.apk
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
